[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E722"]  # allow compact one-liners/bare except in this codebase

[tool.pyright]
include = ["server.py", "naming.py", "test_*.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
